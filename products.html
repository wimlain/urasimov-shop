 <!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>URASINOV — Товары</title>


<style>

/* =========================
   ОСНОВА
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    color: white;

    min-height: 100vh;

    /* ФОН ВСЕЙ СТРАНИЦЫ */
    background:
        linear-gradient(
            rgba(0,0,0,0.55),
            rgba(0,0,0,0.55)
        ),
        url("background.jpg");

    background-size: cover;

    background-position: center;

    background-attachment: fixed;
}


/* =========================
   МЕНЮ
   ФОНА ЗДЕСЬ НЕТ
========================= */

.header {

    width: 100%;

    padding: 22px 40px;

    background: #111;

    display: flex;

    justify-content: space-between;

    align-items: center;

    position: relative;

    z-index: 20;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.4);
}


.logo {

    font-size: 28px;

    font-weight: bold;

    letter-spacing: 2px;
}


.menu {

    display: flex;

    align-items: center;

    gap: 22px;
}


.menu a {

    color: white;

    text-decoration: none;

    font-size: 16px;

    cursor: pointer;

    transition: 0.2s;
}


.menu a:hover {

    opacity: 0.7;
}


/* =========================
   КОРЗИНА В МЕНЮ
========================= */

.cart-button {

    background: white;

    color: black !important;

    padding: 10px 16px;

    border-radius: 10px;

    font-weight: bold;
}


.cart-count {

    display: inline-block;

    background: black;

    color: white;

    min-width: 22px;

    padding: 3px 6px;

    text-align: center;

    border-radius: 20px;

    margin-left: 5px;
}


/* =========================
   ОКНО ТОВАРОВ
========================= */

.products-window {

    width: 90%;

    max-width: 1200px;

    margin: 50px auto;

    padding: 40px;

    background: rgba(20,20,20,0.94);

    border-radius: 25px;

    min-height: 1000px;

    box-shadow:
        0 15px 50px rgba(0,0,0,0.6);
}


.products-title {

    text-align: center;

    font-size: 38px;

    margin-top: 0;

    margin-bottom: 40px;
}


/* =========================
   ТОВАРЫ
========================= */

.products {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 25px;
}


.product {

    background: #1c1c1c;

    padding: 15px;

    border-radius: 18px;

    transition: 0.3s;
}


.product:hover {

    transform: translateY(-5px);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.5);
}


.product img {

    width: 100%;

    height: 220px;

    object-fit: cover;

    border-radius: 12px;
}


.product h2 {

    font-size: 20px;

    margin: 15px 0 8px;
}


.price {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 15px;
}


.buy {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background: white;

    color: black;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}


.buy:hover {

    background: #ddd;

    transform: scale(1.02);
}


/* =========================
   ВСПЛЫВАЮЩЕЕ ОКНО
========================= */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background: rgba(0,0,0,0.78);

    justify-content: center;

    align-items: center;

    padding: 20px;
}


.modal-content {

    width: 100%;

    max-width: 450px;

    background: #181818;

    border-radius: 22px;

    padding: 30px;

    text-align: center;

    position: relative;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.8);
}


.close {

    position: absolute;

    right: 18px;

    top: 10px;

    font-size: 30px;

    color: #aaa;

    cursor: pointer;
}


.close:hover {

    color: white;
}


.modal-image {

    width: 100%;

    max-height: 250px;

    object-fit: cover;

    border-radius: 15px;

    margin-bottom: 15px;
}


.modal-content h2 {

    margin: 5px 0 10px;

    font-size: 27px;
}


.modal-price {

    color: #ccc;
 font-size: 20px;

    margin-bottom: 25px;
}


.modal-buttons {

    display: flex;

    flex-direction: column;

    gap: 12px;
}


.modal-buttons button {

    padding: 15px;

    border: none;

    border-radius: 11px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


.add-cart {

    background: white;

    color: black;
}


.buy-now {

    background: #333;

    color: white;
}


/* =========================
   КОРЗИНА
========================= */

.cart-modal {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 110;

    background: rgba(0,0,0,0.78);

    justify-content: center;

    align-items: center;

    padding: 20px;
}


.cart-content {

    width: 100%;

    max-width: 650px;

    max-height: 85vh;

    overflow-y: auto;

    background: #181818;

    border-radius: 22px;

    padding: 30px;

    position: relative;
}


.cart-content h2 {

    text-align: center;

    margin-top: 0;

    font-size: 30px;
}


/* =========================
   ТОВАР В КОРЗИНЕ
========================= */

.cart-item {

    display: flex;

    align-items: center;

    gap: 15px;

    background: #222;

    padding: 12px;

    border-radius: 13px;

    margin-bottom: 12px;
}


.cart-item img {

    width: 75px;

    height: 75px;

    object-fit: cover;

    border-radius: 10px;
}


.cart-info {

    flex: 1;
}


.cart-info h3 {

    margin: 0 0 6px;

    font-size: 17px;
}


.cart-info p {

    margin: 0;

    color: #bbb;
}


/* =========================
   КОЛИЧЕСТВО
========================= */

.quantity {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 9px;
}


.quantity button {

    width: 28px;

    height: 28px;

    border: none;

    border-radius: 7px;

    cursor: pointer;

    font-weight: bold;
}


.quantity span {

    min-width: 20px;

    text-align: center;
}


.remove {

    border: none;

    background: transparent;

    color: #ff7777;

    cursor: pointer;
}


/* =========================
   ИТОГО
========================= */

.cart-total {

    border-top: 1px solid #444;

    margin-top: 20px;

    padding-top: 20px;

    text-align: right;

    font-size: 22px;

    font-weight: bold;
}


.checkout {

    width: 100%;

    margin-top: 20px;

    padding: 15px;

    border: none;

    border-radius: 11px;

    background: white;

    color: black;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}


.empty {

    text-align: center;

    color: #aaa;

    padding: 35px;
}


/* =========================
   ПОДДЕРЖКА
========================= */

.support {

    width: 90%;

    max-width: 1200px;

    margin: 0 auto;

    padding: 50px 20px 80px;

    text-align: center;
}


.support h2 {

    font-size: 28px;

    margin-bottom: 25px;
}


.support-links {

    display: flex;

    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;
}


.support-link {

    padding: 14px 22px;

    background: rgba(20,20,20,0.92);

    color: white;

    text-decoration: none;

    border-radius: 11px;

    transition: 0.2s;
}


.support-link:hover {

    transform: translateY(-3px);
}


/* =========================
   ТЕЛЕФОН
========================= */

@media (max-width: 800px) {

    .products {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .products-window {

        width: 94%;

        padding: 25px;
    }

}


@media (max-width: 550px) {

    .header {

        padding: 20px;

        flex-direction: column;

        gap: 18px;
    }


    .menu {

        flex-wrap: wrap;

        justify-content: center;

        gap: 10px;
    }


    .products {

        grid-template-columns: 1fr;
    }


    .products-window {

        margin-top: 25px;

        padding: 20px;
    }


    .products-title {

        font-size: 30px;
    }


    .cart-item {

        align-items: flex-start;
    }

}

</style>

</head>


<body>


<!-- =========================
     МЕНЮ
========================= -->

<header class="header">

    <div class="logo">
        URASINOV
    </div>
 <nav class="menu">

        <a href="index.html">
            Главная
        </a>

        <a href="products.html">
            Товары
        </a>

        <a href="#">
            О нас
        </a>

        <a class="cart-button"
           onclick="openCart()">

            🛒 Корзина

            <span
                class="cart-count"
                id="cartCount">

                0

            </span>

        </a>

    </nav>

</header>



<!-- =========================
     ОКНО ТОВАРОВ
========================= -->

<main class="products-window">

    <h1 class="products-title">
        Наши товары
    </h1>


    <div class="products">


        <!-- ТОВАР 1 -->

        <div class="product">

            <img src="product1.jpg"
                 alt="Товар №1">

            <h2>

            </h2>

            </div>

                class="buy"

                )">

        </div>



        <!-- ТОВАР 2 -->

        <div class="product">

            <img src="product2.jpg"
                 alt="Товар №2">

            <h2>
                Товар №2
            </h2>

            <div class="price">
                750 MDL
            </div>

            <button
                class="buy"
                onclick="openProduct(
                    'Товар №2',
                    750,
                    'product2.jpg'
                )">

                Купить

            </button>

        </div>



        <!-- ТОВАР 3 -->

        <div class="product">

            <img src="product3.jpg"
                 alt="Товар №3">

            <h2>
                Товар №3
            </h2>

            <div class="price">
                1000 MDL
            </div>

            <button
                class="buy"
                onclick="openProduct(
                    'Товар №3',
                    1000,
                    'product3.jpg'
                )">

                Купить

            </button>

        </div>


    </div>

</main>



<!-- =========================
     ОКНО ТОВАРА
========================= -->

<div class="modal"
     id="productModal">

    <div class="modal-content">


        <span class="close"
              onclick="closeProduct()">

            ×

        </span>


        <img
            id="modalImage"
            class="modal-image"
            src=""
            alt="Товар">


        <h2 id="modalTitle">
            Товар
        </h2>


        <div
            class="modal-price"
            id="modalPrice">

            0 MDL

        </div>


        <div class="modal-buttons">


            <button
                class="add-cart"
                onclick="addToCart()">

                🛒 Добавить в корзину

            </button>


            <button
                class="buy-now"
                onclick="buyNow()">

                ⚡ Купить сейчас

            </button>


        </div>

    </div>

</div>



<!-- =========================
     КОРЗИНА
========================= -->

<div class="cart-modal"
     id="cartModal">

    <div class="cart-content">


        <span class="close"
              onclick="closeCart()">

            ×

        </span>


        <h2>
            🛒 Ваша корзина
        </h2>


        <div id="cartItems">

            <div class="empty">

                Корзина пока пуста

            </div>

        </div>


        <div class="cart-total">

            Итого:

            <span id="cartTotal">
                0
            </span>

            MDL

        </div>


        <button
            class="checkout"
            onclick="checkout()">

            Перейти к оформлению

        </button>


    </div>

</div>



<!-- =========================
     ПОДДЕРЖКА
========================= -->

<footer class="support">
 <h2>
        Поддержка
    </h2>


    <div class="support-links">


        <a
            href="tel:+37300000000"
            class="support-link">

            📞 +373 00 000 000

        </a>


        <a
            href="#"
            class="support-link">

            Telegram

        </a>


        <a
            href="#"
            class="support-link">

            Viber

        </a>


    </div>

</footer>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   КОРЗИНА
========================= */

let cart = [];


/* Выбранный товар */

let selectedProduct = null;



/* =========================
   ОТКРЫТЬ ТОВАР
========================= */

function openProduct(
    name,
    price,
    image
) {

    selectedProduct = {

        name: name,

        price: price,

        image: image

    };


    document.getElementById(
        "modalTitle"
    ).textContent = name;


    document.getElementById(
        "modalPrice"
    ).textContent =
        price + " MDL";


    document.getElementById(
        "modalImage"
    ).src = image;


    document.getElementById(
        "productModal"
    ).style.display = "flex";
}



/* =========================
   ЗАКРЫТЬ ТОВАР
========================= */

function closeProduct() {

    document.getElementById(
        "productModal"
    ).style.display = "none";
}



/* =========================
   ДОБАВИТЬ В КОРЗИНУ
========================= */

function addToCart() {

    if (!selectedProduct) {
        return;
    }


    let existing =
        cart.find(
            item =>
                item.name ===
                selectedProduct.name
        );


    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            name:
                selectedProduct.name,

            price:
                selectedProduct.price,

            image:
                selectedProduct.image,

            quantity: 1

        });

    }


    updateCart();


    closeProduct();


    alert(
        "Товар добавлен в корзину 🛒"
    );
}



/* =========================
   КУПИТЬ СЕЙЧАС
========================= */

function buyNow() {

    if (!selectedProduct) {
        return;
    }


    cart = [];


    cart.push({

        name:
            selectedProduct.name,

        price:
            selectedProduct.price,

        image:
            selectedProduct.image,

        quantity: 1

    });


    updateCart();


    closeProduct();


    openCart();
}



/* =========================
   ОБНОВЛЕНИЕ КОРЗИНЫ
========================= */

function updateCart() {

    let container =
        document.getElementById(
            "cartItems"
        );


    let count =
        document.getElementById(
            "cartCount"
        );


    let total =
        document.getElementById(
            "cartTotal"
        );


    container.innerHTML = "";


    let totalPrice = 0;

    let totalItems = 0;


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="empty">

                Корзина пока пуста

            </div>

        `;

    }


    cart.forEach(
        (item, index) => {


            totalPrice +=
                item.price *
                item.quantity;


            totalItems +=
                item.quantity;


            container.innerHTML += `

                <div class="cart-item">

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div class="cart-info">

                        <h3>
                            ${item.name}
                        </h3>

                        <p>
                            ${item.price} MDL
                        </p>


                        <div class="quantity">

                            <button
                                onclick="changeQuantity(
                                    ${index},
                                    -1
                                )">
 −

                            </button>


                            <span>

                                ${item.quantity}

                            </span>


                            <button
                                onclick="changeQuantity(
                                    ${index},
                                    1
                                )">

                                +

                            </button>


                            <button
                                class="remove"
                                onclick="removeFromCart(
                                    ${index}
                                )">

                                Удалить

                            </button>

                        </div>

                    </div>

                </div>

            `;
        }
    );


    count.textContent =
        totalItems;


    total.textContent =
        totalPrice;
}



/* =========================
   ИЗМЕНИТЬ КОЛИЧЕСТВО
========================= */

function changeQuantity(
    index,
    amount
) {

    cart[index].quantity +=
        amount;


    if (
        cart[index].quantity <= 0
    ) {

        cart.splice(index, 1);

    }


    updateCart();
}



/* =========================
   УДАЛИТЬ
========================= */

function removeFromCart(index) {

    cart.splice(index, 1);

    updateCart();
}



/* =========================
   ОТКРЫТЬ КОРЗИНУ
========================= */

function openCart() {

    updateCart();


    document.getElementById(
        "cartModal"
    ).style.display = "flex";
}



/* =========================
   ЗАКРЫТЬ КОРЗИНУ
========================= */

function closeCart() {

    document.getElementById(
        "cartModal"
    ).style.display = "none";
}



/* =========================
   ОФОРМЛЕНИЕ
========================= */

function checkout() {

    if (cart.length === 0) {

        alert(
            "Корзина пуста."
        );

        return;
    }


    alert(
        "Здесь будет оформление заказа."
    );
}



/* =========================
   ЗАКРЫТИЕ ОКОН ПО ФОНУ
========================= */

window.onclick =
    function(event) {


        let productModal =
            document.getElementById(
                "productModal"
            );


        let cartModal =
            document.getElementById(
                "cartModal"
            );


        if (event.target ===
            productModal) {

            closeProduct();

        }


        if (event.target ===
            cartModal) {

            closeCart();

        }

    };


</script>


</body>

</html>
